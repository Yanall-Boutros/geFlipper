# Fails if any Python file isn't formatted with black.
# Fix locally with: black .
name: Black

on:
  push:
  pull_request:

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install black
        run: pip install black==26.5.1
      - name: Check formatting
        run: black --check --diff .
